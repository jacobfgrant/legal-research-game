services:
  caddy:
    image: caddy:2
    ports:
      - "8080:8080"  # Case Crawler (local dev)
      - "8081:8081"  # The Brief (local dev)
      - "80:80"      # HTTP (production)
      - "443:443"    # HTTPS (production)
    environment:
      - CASE_CRAWLER_DOMAIN=${CASE_CRAWLER_DOMAIN:-}
      - THE_BRIEF_DOMAIN=${THE_BRIEF_DOMAIN:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  case-crawler-frontend:
    build: ./case-crawler/frontend
    expose:
      - "3000"
    profiles:
      - case-crawler

  case-crawler-backend:
    build: ./case-crawler/backend
    expose:
      - "8000"
    volumes:
      - case-crawler-data:/app/data
    profiles:
      - case-crawler

  the-brief-frontend:
    build: ./the-brief/frontend
    expose:
      - "3000"
    profiles:
      - the-brief

  the-brief-backend:
    build: ./the-brief/backend
    expose:
      - "8000"
    volumes:
      - the-brief-data:/app/data
    profiles:
      - the-brief

volumes:
  caddy_data:
  caddy_config:
  case-crawler-data:
  the-brief-data:
